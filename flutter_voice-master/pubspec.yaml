name: flutter_voice
description: "GearShield 2.0 - Deepfake & AI Voice Detector"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  speech_to_text: ^7.0.0
  avatar_glow: ^3.0.1
  record: ^7.1.1
  http: ^1.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

dependency_overrides:
  record_android: 2.1.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
  adaptive_icon_background: "#184693"
  adaptive_icon_foreground: "assets/logos/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/gearshield_engine.onnx
    - assets/logos/octopus_mask.png


